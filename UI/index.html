<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockchain Consortium</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Blockchain Consortium</h1>

    <div class="form-group">
      <h2>Register Member</h2>
      <label for="memberType">Member Type:</label>
      <input type="text" id="memberType" placeholder="e.g., first, second">
      <div id="dynamicAttributes"></div>
      <button onclick="registerMember()">Register Member</button>
    </div>

    <div class="form-group">
      <h2>Approve Member</h2>
      <label for="approvingMember">Approving Member Name:</label>
      <select id="approvingMember"></select>
      <label for="transactionId">Transaction ID:</label>
      <select id="transactionId"></select>
      <button onclick="approveMember()">Approve Member</button>
    </div>

    <div class="form-group">
      <h2>Reject Member</h2>
      <label for="rejectingMember">Rejecting Member Name:</label>
      <select id="rejectingMember"></select>
      <label for="rejectTransactionId">Transaction ID:</label>
      <select id="rejectTransactionId"></select>
      <label for="rejectionReason">Reason for Rejection:</label>
      <input type="text" id="rejectionReason" placeholder="Reason for Rejection">
      <button onclick="rejectMember()">Reject Member</button>
    </div>

    <div class="form-group">
      <h2>Mine Transactions</h2>
      <button onclick="mineTransactions()">Mine Transactions</button>
    </div>

    <div class="form-group">
      <h2>View Approved Members</h2>
      <button onclick="viewApprovedMembers()">View Approved Members</button>
      <div id="approvedMembers" class="output"></div>
    </div>

    <div class="form-group">
      <h2>View Pending Members</h2>
      <button onclick="viewPendingMembers()">View Pending Members</button>
      <div id="pendingMembers" class="output"></div>
    </div>

    <div class="form-group">
      <h2>View Rejected Members</h2>
      <button onclick="viewRejectedMembers()">View Rejected Members</button>
      <div id="rejectedMembers" class="output"></div>
    </div>

    <div class="form-group">
      <h2>View Blockchain</h2>
      <button onclick="viewBlockchain()">View Blockchain</button>
      <div id="blockchain" class="output"></div>
    </div>

    <div class="form-group">
      <h2>View Mining Queue</h2>
      <button onclick="viewMiningQueue()">View Mining Queue</button>
      <div id="miningQueue" class="output"></div>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
